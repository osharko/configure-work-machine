#format = """
#[╭─user───❯](bold blue) $username
#[┣─system─❯](bold yellow) $hostname
#[┣─project❯](bold red) $directory$rust$git_branch$git_status$package$golang$terraform$docker_context$python$docker_context$nodejs
#[╰─cmd────❯](bold green)
#"""
#format = '$all'

# Limita il tempo per i comandi (custom modules) — evita lag sul prompt
command_timeout = 1000

[localip]
ssh_only = false
format = '📟 [$localipv4](bold red) '
disabled = false

[username]
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = false
format = 'on [$hostname](bold yellow) '
trim_at = "."
disabled = false

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[󰘍](bold green)"     # The "success_symbol" segment is being set to "➜" with the color "bold green"
error_symbol = "[✗](bold red)"
#  
# configure directory
[directory]
read_only = " "
truncation_length = 10
truncate_to_repo = true # truncates directory to root folder if in github repo
style = "bold italic blue"

[cmd_duration]
min_time = 4
show_milliseconds = false
disabled = false
style = "bold italic red"

[aws]
symbol = "  "

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "
style = "blue bold"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []
disabled = false

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "

[golang]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold cyan"
detect_files = ["go.mod", "go.sum", "go.work", ".go-version", ".tool-versions", ".mise.toml"]
disabled = true

[hg_branch]
symbol = " "

[java]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold red"
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts", "deps.edn", "project.clj", "build.boot", ".java-version", ".tool-versions", ".mise.toml"]
disabled = true

[julia]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[package]
symbol = "󰏗 "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "
#pyenv_version_name = true
format = 'via [${symbol}python (${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"
pyenv_prefix = "venv "
python_binary = ["./venv/bin/python", "python", "python3", "python2"]
detect_extensions = ["py"]
version_format = "v${raw}"

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shlvl]
symbol = " "

[swift]
symbol = "ﯣ "

[nodejs]
format = "via [ Node.js $version](bold green) "
detect_files = ["package.json", ".node-version", ".nvmrc", ".tool-versions", ".mise.toml"]
detect_folders = ["node_modules"]
disabled = true

# === mise toolchain (active versions) ===
[custom.mise]
description = "Active mise tools when in a mise-managed project"
shell = ["bash", "--noprofile", "--norc"]
when = """
d="$PWD"
while [ "$d" != "/" ]; do
  for f in .mise.toml mise.toml .tool-versions; do
    [ -e "$d/$f" ] && exit 0
  done
  d="$(dirname "$d")"
done
exit 1
"""
command = """mise current 2>/dev/null | awk 'NR<=4 { printf "%s@%s ", $1, $2 }' | sed 's/ $//'"""
symbol = " "
format = "via [$symbol$output]($style) "
style = "bold yellow"
